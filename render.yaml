services:
  - type: web
    name: finhire-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finhire-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false # Set in Render Dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: finhire-db
    plan: free
