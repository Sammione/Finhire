services:
  # Backend Service
  - type: web
    name: finhire-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finhire-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: finhire-redis
          type: redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

  # Dashboard Service (Next.js)
  - type: web
    name: finhire-dashboard
    runtime: node
    rootDir: dashboard
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://finhire-backend.onrender.com/api/v1

  # Redis Service
  - type: redis
    name: finhire-redis
    plan: free

databases:
  - name: finhire-db
    plan: free
